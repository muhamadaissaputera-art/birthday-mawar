<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Buat QR Code · Untuk Mawarni</title><style>body{font-family:Arial,sans-serif;background:#160d1f;color:#fff;min-height:100vh;display:grid;place-items:center;margin:0;padding:20px}.box{max-width:520px;width:100%;background:#241329;border:1px solid #513047;border-radius:24px;padding:30px;text-align:center;box-shadow:0 25px 70px #0008}h1{font-family:Georgia,serif;font-weight:400}p{color:#cbb6c2;line-height:1.6}input{width:100%;padding:15px;border-radius:12px;border:1px solid #654057;background:#160d1f;color:white;box-sizing:border-box;margin:12px 0 16px}button{padding:13px 20px;border:0;border-radius:999px;background:#f2bfd0;color:#2b1826;font-weight:700;cursor:pointer}#qr{margin:25px auto 10px;background:white;padding:16px;width:max-content;border-radius:12px;min-height:20px}.hint{font-size:12px}</style></head><body><div class="box"><h1>♡ QR Code untuk Mawarni</h1><p>Setelah website ini kamu upload ke hosting, masukkan URL-nya di bawah. QR Code akan dibuat otomatis.</p><input id="url" placeholder="https://contoh.com/untuk-mawarni"><br><button onclick="makeQR()">Buat QR Code</button><div id="qr"></div><p class="hint">Klik kanan QR Code → simpan gambar, lalu cetak di kartu atau hadiah.</p></div><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><script>function makeQR(){const u=document.getElementById('url').value.trim();if(!u)return alert('Masukkan URL website dulu.');const q=document.getElementById('qr');q.innerHTML='';new QRCode(q,{text:u,width:260,height:260,colorDark:'#160d1f',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.H});}</script></body></html>
